# =====================================================
#   netlify.toml — Konfigurasi Deploy Smart K3 Camera
# =====================================================

# Redirect: buka URL root → langsung ke halaman login
[[redirects]]
  from   = "/"
  to     = "/login.html"
  status = 302

# Header keamanan untuk semua halaman
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options        = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"
